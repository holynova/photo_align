<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">人像时间线 Photo Align — 浏览器本地识别人脸、按日期排序、对齐双眼，导出 MP4/GIF 时间线</title>
  <desc id="desc">深灰底配柠檬黄强调：左上标题人像时间线；右侧一张人像框，双眼连线对齐虚线，下方是 1995 到 2024 的时间线缩略图条。</desc>

  <rect width="1200" height="360" rx="26" fill="#1a1a18"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#c8f169">本地隐私工具 · LOCAL FACE TIMELINE</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f2f0e8">人像时间线</text>
    <text x="56" y="168" font-size="23" fill="#d8d5c8">PHOTO ALIGN — 把多年照片，对齐成一部影片</text>
    <text x="56" y="204" font-size="19" fill="#a8a59a">本地识别人脸、按日期排序、对齐双眼再导出。</text>
    <g id="chips" font-size="18" fill="#f2f0e8" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#262622" stroke="#44443c" stroke-width="1.5"/><text x="119" y="262">最多 100 张</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#262622" stroke="#44443c" stroke-width="1.5"/><text x="269" y="262">本地识别不上传</text></g>
      <g><rect x="356" y="238" width="126" height="36" rx="18" fill="#262622" stroke="#44443c" stroke-width="1.5"/><text x="419" y="262">双眼对齐</text></g>
      <g><rect x="494" y="238" width="186" height="36" rx="18" fill="#262622" stroke="#44443c" stroke-width="1.5"/><text x="587" y="262">MP4 · WebM · GIF</text></g>
    </g>
  </g>

  <g id="diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="portrait">
      <rect x="820" y="44" width="180" height="220" rx="14" fill="#2a2a26" stroke="#44443c" stroke-width="1.5"/>
      <ellipse cx="910" cy="140" rx="52" ry="66" fill="#d8c9a8"/>
      <circle cx="890" cy="128" r="7" fill="#1a1a18"/>
      <circle cx="930" cy="128" r="7" fill="#1a1a18"/>
      <path d="M 895 168 Q 910 178 925 168" stroke="#1a1a18" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="848" y1="128" x2="972" y2="128" stroke="#c8f169" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="910" y="252" font-size="15" fill="#a8a59a" text-anchor="middle">双眼对齐线</text>
    </g>
    <g id="timeline">
      <line x1="820" y1="308" x2="1140" y2="308" stroke="#44443c" stroke-width="2"/>
      <g id="year-labels" font-size="14" text-anchor="middle">
        <text x="842" y="344" fill="#a8a59a">1995</text>
        <text x="922" y="344" fill="#a8a59a">2005</text>
        <text x="1002" y="344" fill="#a8a59a">2015</text>
        <text x="1082" y="344" fill="#c8f169">2024</text>
      </g>
      <g id="thumbs">
        <rect x="820" y="286" width="44" height="44" rx="6" fill="#3a3a34"/>
        <rect x="900" y="286" width="44" height="44" rx="6" fill="#3a3a34"/>
        <rect x="980" y="286" width="44" height="44" rx="6" fill="#3a3a34"/>
        <rect x="1060" y="286" width="44" height="44" rx="6" fill="#c8f169"/>
      </g>
    </g>
    <g id="face-dots" fill="#c8f169">
      <circle cx="842" cy="308" r="5"/>
      <circle cx="922" cy="308" r="5"/>
      <circle cx="1002" cy="308" r="5"/>
      <circle cx="1082" cy="308" r="5" fill="#1a1a18"/>
    </g>
  </g>
</svg>
